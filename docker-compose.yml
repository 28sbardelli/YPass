# Production stack: Postgres + Redis + app.
# Host Nginx (loopback 3000): docker compose -f docker-compose.yml -f docker-compose.host.yml up -d
# In-compose Nginx:            docker compose --profile edge up -d
#
# Required in the project .env (Compose interpolates these):
#   POSTGRES_PASSWORD, REDIS_PASSWORD
# URL-encode any special characters in those passwords inside DATABASE_URL/REDIS_URL.

x-app-environment: &app-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: '3000'
  TRUST_PROXY: '1'
  DATABASE_PROVIDER: postgres
  DATABASE_URL: postgres://formbar:${POSTGRES_PASSWORD}@postgres:5432/formbar_app
  DATABASE_SSL: disable
  REDIS_ENABLED: 'true'
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  WEB_CONCURRENCY: '1'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: formbar_app
      POSTGRES_USER: formbar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U formbar -d formbar_app']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - internal

  migrate:
    build: .
    image: formbar-app:local
    env_file:
      - .env
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        'sh',
        '-c',
        'node scripts/wait-for-deps.js && node scripts/db-migrate.js && node scripts/db-seed.js',
      ]
    restart: 'no'
    networks:
      - internal

  app:
    build: .
    image: formbar-app:local
    env_file:
      - .env
    environment:
      <<: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3000'
    restart: unless-stopped
    networks:
      - internal

  nginx:
    profiles: ['edge']
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/formbar-app/public:ro
      - ${TLS_CERT_PATH:-./deploy/docker/certs/fullchain.pem}:/etc/nginx/certs/fullchain.pem:ro
      - ${TLS_KEY_PATH:-./deploy/docker/certs/privkey.pem}:/etc/nginx/certs/privkey.pem:ro
    restart: unless-stopped
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
