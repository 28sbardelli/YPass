<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register YPass Kiosk</title>
    <link rel="stylesheet" href="/css/register.css" />
  </head>
  <body>
    <main class="shell">
      <p class="kicker">YPass · Kiosk registration</p>
      <h1>Register this kiosk</h1>
      <p class="description">Enter the enrollment code below in YPass Manager to connect this kiosk.</p>
      <p class="code-label">Enrollment code</p>
      <p class="enrollment-code" id="enrollmentCodeDisplay" aria-live="polite">Connecting...</p>
      <p class="expiry" id="enrollmentExpiry">Waiting for registration...</p>
      <div class="status" id="statusPanel" role="status" aria-live="polite">
        <strong>Status:</strong> Checking kiosk configuration...
      </div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
