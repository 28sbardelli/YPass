<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YPass Kiosk</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --card: #1f2937;
        --accent: #38bdf8;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --success: #22c55e;
        --warning: #f59e0b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, var(--bg), #111827);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .shell {
        width: min(900px, 90vw);
        padding: 24px;
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 18px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.5);
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 18px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.12);
        color: var(--accent);
        font-weight: 700;
      }
      .grid {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 20px;
      }
      .panel {
        background: rgba(31, 41, 55, 0.94);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 14px;
        padding: 18px;
      }
      label {
        display: block;
        font-size: 0.8rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }
      input,
      select,
      button {
        width: 100%;
        margin-bottom: 12px;
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        background: rgba(15, 23, 42, 0.8);
        color: var(--text);
        padding: 12px 14px;
        font-size: 1rem;
      }
      button {
        cursor: pointer;
        font-weight: 700;
        background: linear-gradient(135deg, #0ea5e9, #2563eb);
        border: none;
      }
      button.secondary {
        background: linear-gradient(135deg, #334155, #1e293b);
      }
      .status {
        margin-top: 10px;
        padding: 12px;
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.85);
        color: var(--muted);
      }
      .status strong {
        color: var(--text);
      }
      .ok {
        border-left: 4px solid var(--success);
      }
      .warn {
        border-left: 4px solid var(--warning);
      }
      ul {
        margin: 0.5rem 0 0 1rem;
        color: var(--muted);
      }
      @media (max-width: 760px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="header">
        <div>
          <div class="badge" id="kioskBadge">Loading kiosk…</div>
          <h1 style="margin: 10px 0 0">Hall Pass Kiosk</h1>
        </div>
        <div class="badge" id="connectionBadge">Checking connection…</div>
      </div>

      <div class="grid">
        <section class="panel" id="enrollmentPanel" hidden>
          <h2>Register this kiosk</h2>
          <p>Enter this enrollment code in YPass Manager to register the kiosk.</p>
          <p><strong id="enrollmentCodeDisplay">Connecting...</strong></p>
          <p id="enrollmentExpiry">Waiting for registration...</p>
          <label for="serverUrl">YPass server URL</label>
          <input
            id="serverUrl"
            name="serverUrl"
            placeholder="https://ypass.school.edu"
            type="url"
            readonly
          />
        </section>
        <aside class="panel">
          <h2>Machine status</h2>
          <ul>
            <li><strong>Kiosk:</strong> <span id="kioskCode">--</span></li>
            <li><strong>Location:</strong> <span id="kioskLocation">--</span></li>
          </ul>
        </aside>
      </div>

      <div class="status" id="statusPanel" role="status" aria-live="polite">
        <strong>Status:</strong> Checking kiosk configuration...
      </div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
